name: Refresh official fleet data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: fleet-refresh
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  validate:
    name: Validate and package generated data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SEC_USER_AGENT: DrillshipStatus/1.0 contiloop@users.noreply.github.com
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout exact main revision without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record immutable base revision
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This publisher only accepts runs based on refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base revision: $GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match the workflow base revision." >&2
            exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --requirement automation/requirements.lock
          npm ci

      - name: Run parser and unit tests
        run: python -m pytest automation/tests -q

      - name: Discover, parse, validate, and write generated JSON
        run: python -m automation.fleet_sync --write

      - name: Test official announcement cards against generated data
        run: npm run test:ui

      - name: Build dashboard against generated data
        run: npm run build

      - name: Stage generated-only artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$(mktemp -d "$RUNNER_TEMP/fleet-refresh-artifact.XXXXXX")"
          mkdir -p \
            "$artifact_root/metadata" \
            "$artifact_root/payload/public/data" \
            "$artifact_root/payload/data/provenance"

          cp -a public/data/. "$artifact_root/payload/public/data/"
          cp -a data/provenance/. "$artifact_root/payload/data/provenance/"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/metadata/base-sha"

          test -f "$artifact_root/payload/public/data/manifest.json"
          test -f "$artifact_root/payload/public/data/changes.json"
          test -f "$artifact_root/payload/data/provenance/sources.json"
          test -f "$artifact_root/payload/data/provenance/observations.json"

          while IFS= read -r -d '' entry; do
            relative="${entry#"$artifact_root"/}"
            if [[ -L "$entry" ]] || [[ ! -d "$entry" && ! -f "$entry" ]]; then
              echo "Artifact contains a link or special file: $relative" >&2
              exit 1
            fi
            case "$relative" in
              metadata|payload|payload/public|payload/public/data|payload/data|payload/data/provenance)
                [[ -d "$entry" ]] || exit 1
                ;;
              metadata/base-sha)
                [[ -f "$entry" ]] || exit 1
                ;;
              payload/public/data/*|payload/data/provenance/*)
                [[ "$relative" =~ ^payload/(public/data|data/provenance)/[A-Za-z0-9._/-]+$ ]] || {
                  echo "Unsafe generated path: $relative" >&2
                  exit 1
                }
                ;;
              *)
                echo "Artifact path is outside the allowlist: $relative" >&2
                exit 1
                ;;
            esac
          done < <(find -P "$artifact_root" -mindepth 1 -print0)

          (
            cd "$artifact_root/payload"
            find public/data data/provenance -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum
          ) > "$artifact_root/metadata/files.sha256"
          test -s "$artifact_root/metadata/files.sha256"
          echo "path=$artifact_root" >> "$GITHUB_OUTPUT"

      - name: Upload generated data and base metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fleet-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated generated data
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout immutable base with publisher credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download generated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fleet-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fleet-refresh-download

      - name: Validate artifact, commit generated paths, and push safely
        id: publish
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          ARTIFACT_ROOT: ${{ runner.temp }}/fleet-refresh-download
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected base revision." >&2
            exit 1
          fi
          artifact_base="$(tr -d '\r\n' < "$ARTIFACT_ROOT/metadata/base-sha")"
          checkout_base="$(git rev-parse HEAD)"
          if [[ "$artifact_base" != "$EXPECTED_BASE_SHA" || "$checkout_base" != "$EXPECTED_BASE_SHA" || "$GITHUB_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Artifact, checkout, and workflow base revisions do not match." >&2
            exit 1
          fi

          test -f "$ARTIFACT_ROOT/payload/public/data/manifest.json"
          test -f "$ARTIFACT_ROOT/payload/public/data/changes.json"
          test -f "$ARTIFACT_ROOT/payload/data/provenance/sources.json"
          test -f "$ARTIFACT_ROOT/payload/data/provenance/observations.json"
          test -f "$ARTIFACT_ROOT/metadata/files.sha256"

          while IFS= read -r -d '' entry; do
            relative="${entry#"$ARTIFACT_ROOT"/}"
            if [[ -L "$entry" ]] || [[ ! -d "$entry" && ! -f "$entry" ]]; then
              echo "Artifact contains a link or special file: $relative" >&2
              exit 1
            fi
            case "$relative" in
              metadata|payload|payload/public|payload/public/data|payload/data|payload/data/provenance)
                [[ -d "$entry" ]] || exit 1
                ;;
              metadata/base-sha|metadata/files.sha256)
                [[ -f "$entry" ]] || exit 1
                ;;
              payload/public/data/*|payload/data/provenance/*)
                [[ "$relative" =~ ^payload/(public/data|data/provenance)/[A-Za-z0-9._/-]+$ ]] || {
                  echo "Unsafe generated path: $relative" >&2
                  exit 1
                }
                ;;
              *)
                echo "Artifact path is outside the allowlist: $relative" >&2
                exit 1
                ;;
            esac
          done < <(find -P "$ARTIFACT_ROOT" -mindepth 1 -print0)

          actual_checksums="$(mktemp "$RUNNER_TEMP/fleet-refresh-checksums.XXXXXX")"
          (
            cd "$ARTIFACT_ROOT/payload"
            find public/data data/provenance -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum
          ) > "$actual_checksums"
          if ! cmp -s "$ARTIFACT_ROOT/metadata/files.sha256" "$actual_checksums"; then
            echo "Artifact checksum manifest does not match its payload." >&2
            exit 1
          fi

          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "main changed during validation; refusing a stale publication." >&2
            exit 1
          fi

          rm -rf public/data data/provenance
          mkdir -p public/data data/provenance
          cp -a "$ARTIFACT_ROOT/payload/public/data/." public/data/
          cp -a "$ARTIFACT_ROOT/payload/data/provenance/." data/provenance/
          find public/data data/provenance -type d -exec chmod 0755 {} +
          find public/data data/provenance -type f -exec chmod 0644 {} +
          git add -A -- public/data data/provenance

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              public/data/*|data/provenance/*) ;;
              *)
                echo "Staged path is outside the publication allowlist: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only -z)

          if git diff --cached --quiet; then
            echo "Official data is unchanged; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "contiloop"
          git config user.email "126137639+contiloop@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "Refresh verified fleet data"

          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "main changed before push; refusing a stale publication." >&2
            exit 1
          fi
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/main

          manifest="$ARTIFACT_ROOT/payload/public/data/manifest.json"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "data_hash=$(jq -er '.dataHash' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "state_fingerprint=$(jq -er '.stateFingerprint' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "fleet_file=$(jq -er '.fleetFile' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "events_file=$(jq -er '.eventsFile' "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Verify canonical Vercel deployment
        if: steps.publish.outputs.published == 'true'
        shell: bash
        env:
          EXPECTED_DATA_HASH: ${{ steps.publish.outputs.data_hash }}
          EXPECTED_STATE_FINGERPRINT: ${{ steps.publish.outputs.state_fingerprint }}
          EXPECTED_FLEET_FILE: ${{ steps.publish.outputs.fleet_file }}
          EXPECTED_EVENTS_FILE: ${{ steps.publish.outputs.events_file }}
          PRODUCTION_URL: https://offshore-drillship-fleet-analyst.vercel.app
        run: |
          set -euo pipefail
          live_manifest="$(mktemp "$RUNNER_TEMP/live-manifest.XXXXXX")"

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_URL/data/manifest.json?expected=$EXPECTED_DATA_HASH" \
              --output "$live_manifest"; then
              live_hash="$(jq -er '.dataHash' "$live_manifest" 2>/dev/null || true)"
              live_state="$(jq -er '.stateFingerprint' "$live_manifest" 2>/dev/null || true)"
              live_fleet="$(jq -er '.fleetFile' "$live_manifest" 2>/dev/null || true)"
              live_events="$(jq -er '.eventsFile' "$live_manifest" 2>/dev/null || true)"
              if [[ "$live_hash" == "$EXPECTED_DATA_HASH" \
                    && "$live_state" == "$EXPECTED_STATE_FINGERPRINT" \
                    && "$live_fleet" == "$EXPECTED_FLEET_FILE" \
                    && "$live_events" == "$EXPECTED_EVENTS_FILE" ]] \
                && curl --fail --silent --show-error --max-time 20 \
                  "$PRODUCTION_URL/" --output /dev/null \
                && curl --fail --silent --show-error --max-time 20 \
                  "$PRODUCTION_URL/data/$EXPECTED_FLEET_FILE" --output /dev/null \
                && curl --fail --silent --show-error --max-time 20 \
                  "$PRODUCTION_URL/data/$EXPECTED_EVENTS_FILE" --output /dev/null; then
                echo "Vercel is serving verified state $EXPECTED_STATE_FINGERPRINT."
                exit 0
              fi
            fi
            echo "Deployment not ready (attempt $attempt/24); retrying in 10 seconds."
            sleep 10
          done

          echo "Vercel did not serve expected data hash $EXPECTED_DATA_HASH within four minutes." >&2
          exit 1
